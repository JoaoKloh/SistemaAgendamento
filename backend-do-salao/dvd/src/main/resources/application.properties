spring.application.name=${APPLICATION_NAME:dvd}

api.security.refresh.expiration-days=${EXPIRATION_TK_DAYS}
resend.api.email.from=${EMAIL_FROM}

spring.datasource.url=${URL_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

url.frontend=${FRONTEND_URL}
rsa.public-key-path=${RSA_PUBLIC_KEY_PATH}
rsa.private-key-path=${RSA_PRIVATE_KEY_PATH}
resend.api.key=${RESEND_API_KEY}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}